# Server config template for the mini-chat black-box smoke test (run_smoke.py).
#
# run_smoke.py replaces the @@NAME@@ placeholders by plain text substitution:
#   @@HOME_DIR@@     fresh temporary directory (gear SQLite DBs, logs, gRPC socket)
#   @@API_PORT@@     free local port for the api-gateway
#   @@PROVIDERS@@    the mini-chat `providers` map as a JSON (= YAML flow) mapping;
#                    one provider pointing at the mock (openai or azure flavour)
#   @@PROVIDER_ID@@  key of that provider, used by the model catalog
#
# Mirrors config/mini-chat.yaml (gear set and catalog) and config/e2e-local.yaml
# (static-token authn with two tenants, OAGW plain-HTTP upstreams, throttling zones).
# The provider secret is NOT configured here: config-seeded static-credstore secrets
# are not readable through the credstore gateway, so run_smoke.py creates it with
# `POST /credstore/v1/secrets` as the S2S identity (tenant A user 1).

server:
  home_dir: "@@HOME_DIR@@"

database:
  servers:
    sqlite_mini_chat:
      engine: "sqlite"
      params:
        WAL: "true"
        synchronous: "NORMAL"
        busy_timeout: "5000"
      pool:
        max_conns: 5
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/cf-gears.log"
    file_level: info
  mini_chat:
    console_level: info
    file: "logs/mini-chat.log"
    file_level: debug

gears:
  api-gateway:
    config:
      bind_addr: "127.0.0.1:@@API_PORT@@"
      enable_docs: false
      cors_enabled: false
      openapi:
        title: "Mini-Chat smoke"
        version: "0.1.0"
        description: "Mini-Chat black-box smoke test"
      defaults:
        body_limit_bytes: 64000000
      auth_disabled: false
      require_auth_by_default: true
      # Throttling zones referenced by the mini-chat routes; startup fails without them.
      rate_limit_zones:
        rl_mini_chat_chat:
          rate_limit: 100/s
          burst_limit: 100
          response_status_code: 429
          response_retry_after: auto
          key:
            type: ip
          max_keys: 10000
      in_flight_limit_zones:
        ifl_mini_chat_chat:
          in_flight_limit: 100
          backlog_limit: 0
          backlog_timeout: 0s
          response_status_code: 429
          key:
            type: ip
          max_keys: 10000

  gear-orchestrator:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds://@@HOME_DIR@@/grpc.sock"

  authn-resolver:
    config:
      vendor: "constructorfabric"

  authz-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      mode: static_tokens
      tokens:
        # Tenant A, user 1. Also the S2S identity (s2s_credentials below map to the
        # default identity 11111111-… / 00000000-df51-…), i.e. the owner of the
        # provider secret.
        - token: "smoke-token-tenant-a"
          identity:
            subject_id: "11111111-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        # Tenant A, user 2 (same tenant, other owner).
        - token: "smoke-token-tenant-a-user2"
          identity:
            subject_id: "44444444-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        # Tenant B.
        - token: "smoke-token-tenant-b"
          identity:
            subject_id: "22222222-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
      s2s_credentials:
        - client_id: "mini-chat"
          client_secret: "mini-chat-dev-secret"

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  single-tenant-tr-plugin:
    config:
      vendor: "constructorfabric"

  simple-user-settings:
    database:
      server: "sqlite_mini_chat"
      file: "settings.db"
    config:
      max_field_length: 100

  credstore:
    database:
      server: "sqlite_mini_chat"
      file: "credstore.db"
    config:
      vendor: "constructorfabric"

  static-credstore-plugin:
    config:
      secrets: []

  file-parser:
    config:
      allowed_local_base_dir: /tmp

  resource-group:
    database:
      server: "sqlite_mini_chat"
      file: "resource_group.db"
    config: {}

  mini-chat:
    database:
      server: "sqlite_mini_chat"
      file: "mini_chat.db"
    config:
      vendor: "constructorfabric"
      orphan_watchdog:
        scan_interval_secs: 10
        timeout_secs: 90
      client_credentials:
        client_id: "mini-chat"
        client_secret: "mini-chat-dev-secret"
      thread_summary_worker:
        enabled: true
        summary_model_id: "gpt-4.1-mini"
        compression_threshold_pct: 80
        summary_system_prompt: "Summarize the conversation. Respond with an <analysis> block followed by a <summary> block."
      providers: @@PROVIDERS@@

  static-mini-chat-audit-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      enabled: true

  static-mini-chat-model-policy-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      model_catalog:
        # Premium default model: web_search and file_search supported.
        - id: "gpt-4.1"
          provider_model_id: "gpt-4.1"
          display_name: "GPT-4.1"
          description: "Most capable model"
          provider_id: "@@PROVIDER_ID@@"
          provider_display_name: "Mock OpenAI"
          icon: ""
          tier: Premium
          enabled: true
          system_prompt: "You are a helpful, concise assistant."
          thread_summary_prompt: ""
          multimodal_capabilities: ["VISION_INPUT"]
          context_window: 1047576
          max_output_tokens: 32768
          max_input_tokens: 1047576
          input_tokens_credit_multiplier_micro: 3000000
          output_tokens_credit_multiplier_micro: 15000000
          multiplier_display: "3x"
          estimation_budgets:
            bytes_per_token_conservative: 4
            fixed_overhead_tokens: 100
            safety_margin_pct: 10
            image_token_budget: 1000
            tool_surcharge_tokens: 500
            web_search_surcharge_tokens: 500
            code_interpreter_surcharge_tokens: 1000
            minimal_generation_floor: 50
          max_num_results: 5
          web_search_context_size: low
          max_tool_calls: 10
          general_config:
            type: ""
            available_from: "1970-01-01T00:00:00Z"
            max_file_size_mb: 25
            api_params:
              temperature: 0.7
              top_p: 1.0
              frequency_penalty: 0.0
              presence_penalty: 0.0
              stop: []
            features:
              streaming: true
              structured_output: true
            tool_support:
              web_search: true
              file_search: true
              image_generation: false
              code_interpreter: true
              mcp: false
            supported_endpoints:
              chat_completions: true
              responses: true
              embeddings: false
              image_generation: false
              audio_speech_generation: false
              audio_transcription: false
              audio_translation: false
          preference:
            is_default: true
            sort_order: 0

        # Standard model; also the thread-summary model.
        - id: "gpt-4.1-mini"
          provider_model_id: "gpt-4.1-mini"
          display_name: "GPT-4.1 Mini"
          description: "Fast and efficient model"
          provider_id: "@@PROVIDER_ID@@"
          provider_display_name: "Mock OpenAI"
          icon: ""
          tier: Standard
          enabled: true
          system_prompt: "You are a helpful, concise assistant."
          thread_summary_prompt: ""
          multimodal_capabilities: ["VISION_INPUT"]
          context_window: 1047576
          max_output_tokens: 32768
          max_input_tokens: 1047576
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          multiplier_display: "1x"
          max_num_results: 5
          web_search_context_size: low
          max_tool_calls: 10
          general_config:
            type: ""
            available_from: "1970-01-01T00:00:00Z"
            max_file_size_mb: 25
            api_params:
              temperature: 0.7
              top_p: 1.0
              frequency_penalty: 0.0
              presence_penalty: 0.0
              stop: []
            features:
              streaming: true
              structured_output: true
            tool_support:
              web_search: false
              file_search: false
              image_generation: false
              code_interpreter: false
              mcp: false
            supported_endpoints:
              chat_completions: true
              responses: true
              embeddings: false
              image_generation: false
              audio_speech_generation: false
              audio_transcription: false
              audio_translation: false
          preference:
            is_default: false
            sort_order: 1

  oagw:
    config:
      proxy_timeout_secs: 30
      # Only for the local mock: plain-HTTP upstream on 127.0.0.1.
      allow_http_upstream: true
      ssrf_policy:
        enabled: false

opentelemetry:
  tracing:
    enabled: false
  metrics:
    enabled: false
