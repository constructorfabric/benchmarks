# mini-chat end-to-end test configuration: provider = local mock (mock_llm.py).
server:
  home_dir: "/tmp/mini-chat-e2e-home"

database:
  servers:
    sqlite_mini_chat:
      engine: "sqlite"
      params:
        WAL: "true"
        synchronous: "NORMAL"
        busy_timeout: "5000"
      pool:
        max_conns: 5
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/cf-gears.log"
    file_level: info
  mini_chat:
    console_level: debug
    file: "logs/mini-chat.log"
    file_level: debug

gears:
  api-gateway:
    config:
      bind_addr: "127.0.0.1:18087"
      enable_docs: true
      cors_enabled: true
      defaults:
        body_limit_bytes: 64000000
      auth_disabled: false
      rate_limit_zones:
        rl_mini_chat_chat:
          rate_limit: 1000/s
          burst_limit: 1000
          response_status_code: 429
          response_retry_after: auto
          key:
            type: ip
          max_keys: 10000
      in_flight_limit_zones:
        ifl_mini_chat_chat:
          in_flight_limit: 100
          backlog_limit: 0
          backlog_timeout: 0s
          response_status_code: 429
          key:
            type: ip
          max_keys: 10000

  gear-orchestrator:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/mini-chat-e2e-grpc"

  authn-resolver:
    config:
      vendor: "constructorfabric"

  authz-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      mode: static_tokens
      tokens:
        - token: "user-a"
          identity:
            subject_id: "11111111-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            token_scopes: ["*"]
        - token: "user-b"
          identity:
            subject_id: "22222222-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            token_scopes: ["*"]
        - token: "user-c"
          identity:
            subject_id: "33333333-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-df51-5b42-9538-d2b56b7ee953"
            token_scopes: ["*"]
        - token: "user-nil"
          identity:
            subject_id: "66666666-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "00000000-0000-0000-0000-000000000000"
            token_scopes: ["*"]
        - token: "user-x"
          identity:
            subject_id: "55555555-6a88-4768-9dfc-6bcd5187d9ed"
            subject_tenant_id: "44444444-df51-5b42-9538-d2b56b7ee953"
            token_scopes: ["*"]
      s2s_credentials:
        - client_id: "mini-chat"
          client_secret: "mini-chat-dev-secret"

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  single-tenant-tr-plugin:
    config:
      vendor: "constructorfabric"

  credstore:
    database:
      server: "sqlite_mini_chat"
      file: "credstore.db"
    config:
      vendor: "constructorfabric"

  static-credstore-plugin:
    config: {}

  oagw:
    config:
      proxy_timeout_secs: 60
      allow_http_upstream: true
      ssrf_policy:
        enabled: false

  mini-chat:
    database:
      server: "sqlite_mini_chat"
      file: "mini_chat.db"
    config:
      vendor: "constructorfabric"
      client_credentials:
        client_id: "mini-chat"
        client_secret: "mini-chat-dev-secret"
      streaming:
        sse_ping_interval_seconds: 5
      rag:
        max_documents_per_chat: 3
        max_total_upload_mb_per_chat: 2
        max_images_per_message: 2
      orphan_watchdog:
        scan_interval_secs: 2
        timeout_secs: 90
      upload_reaper:
        enabled: true
        scan_interval_secs: 2
        stale_after_secs: 60
      quota:
        overshoot_tolerance_factor: 1.10
      providers:
        openai:
          kind: openai_responses
          storage_kind: openai
          host: "127.0.0.1"
          port: 18090
          use_http: true
          upstream_alias: "mock-llm"
          api_path: "/v1/responses"

  static-mini-chat-audit-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      enabled: true

  static-mini-chat-model-policy-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      default_standard_limits:
        limit_daily_credits_micro: 100000000
        limit_monthly_credits_micro: 1000000000
      default_premium_limits:
        limit_daily_credits_micro: 50000000
        limit_monthly_credits_micro: 500000000
      model_catalog:
        - id: "gpt-4.1"
          provider_model_id: "gpt-4.1"
          display_name: "GPT-4.1"
          description: "Most capable model"
          provider_id: "openai"
          provider_display_name: "OpenAI"
          tier: premium
          enabled: true
          system_prompt: "You are a helpful assistant."
          multimodal_capabilities: ["VISION_INPUT", "RAG"]
          context_window: 128000
          max_output_tokens: 4096
          max_input_tokens: 100000
          input_tokens_credit_multiplier_micro: 3000000
          output_tokens_credit_multiplier_micro: 15000000
          multiplier_display: "3x"
          max_num_results: 5
          max_tool_calls: 2
          general_config:
            max_file_size_mb: 25
            tool_support:
              web_search: true
              file_search: true
              code_interpreter: true
          preference:
            is_default: true
            sort_order: 0
        - id: "gpt-4.1-mini"
          provider_model_id: "gpt-4.1-mini"
          display_name: "GPT-4.1 Mini"
          description: "Fast model"
          provider_id: "openai"
          provider_display_name: "OpenAI"
          tier: standard
          enabled: true
          multimodal_capabilities: ["RAG"]
          context_window: 128000
          max_output_tokens: 4096
          max_input_tokens: 100000
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          multiplier_display: "1x"
          max_num_results: 5
          general_config:
            max_file_size_mb: 1
            tool_support:
              web_search: false
              file_search: true
              code_interpreter: false
          preference:
            is_default: false
            sort_order: 1
        - id: "gpt-4.1-mini-tiny-ctx"
          provider_model_id: "gpt-4.1-mini"
          display_name: "Tiny context"
          provider_id: "openai"
          provider_display_name: "OpenAI"
          tier: standard
          enabled: true
          context_window: 4096
          max_output_tokens: 1024
          max_input_tokens: 3072
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          max_num_results: 5
          general_config:
            max_file_size_mb: 25
          preference:
            sort_order: 2
        - id: "disabled-model"
          provider_model_id: "gpt-x"
          display_name: "Disabled"
          provider_id: "openai"
          provider_display_name: "OpenAI"
          tier: standard
          enabled: false
          context_window: 128000
          max_output_tokens: 4096
          max_input_tokens: 100000
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          max_num_results: 5
          general_config: {}

opentelemetry:
  tracing:
    enabled: false
  metrics:
    enabled: false
