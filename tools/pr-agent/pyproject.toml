[project]
name = "pr-bench"
version = "0.1.0"
description = "PR-Agent review benchmark on B9-minichat (CLLM-598)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PR-Agent's git_providers registry imports the GitHub provider, so the extra is needed even
    # though the benchmark only uses the local provider
    "pr-agent[github]==0.48.0",
    "litellm==1.105.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_bench"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 150
target-version = "py312"
# vendored unchanged from spec-bench
extend-exclude = ["pr_bench/runner/seat_budget.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# one-line `if x: return` guards are the house style
ignore = ["E701", "E702", "E731"]
