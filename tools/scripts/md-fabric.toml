skip_dirs = [".cargo", "target", "testing/e2e"]

# ── Repo ───────────────────────────────────────────────────────────────────

[[categories]]
id    = "repo"
label = "Repository"

[[categories.buckets]]
id       = "(root)"
pattern  = "*.md"

[[categories.buckets]]
id       = ".github"
pattern  = ".github/**/*.md"

# ── ToolKit ────────────────────────────────────────────────────────────────────

[[categories]]
id    = "toolkit"
label = "ToolKit"

[[categories.buckets]]
id      = "docs-adrs"
pattern = "docs/adrs/**/*.md"

[[categories.buckets]]
id      = "docs-arch-authorization"
pattern = "docs/arch/authorization/**/*.md"

[[categories.buckets]]
id      = "docs-arch-errors"
pattern = "docs/arch/errors/**/*.md"

[[categories.buckets]]
id      = "docs-arch"
pattern = "docs/arch/**/*.md"

[[categories.buckets]]
id      = "docs-checklists"
pattern = "docs/checklists/**/*.md"

[[categories.buckets]]
id      = "docs-toolkit-unified-system"
pattern = "docs/toolkit_unified_system/**/*.md"

[[categories.buckets]]
id      = "docs-pr-review"
pattern = "docs/pr-review/**/*.md"

[[categories.buckets]]
id      = "docs-security"
pattern = "docs/security/**/*.md"

[[categories.buckets]]
id      = "docs"
pattern = "docs/**/*.md"

[[categories.buckets]]
id      = "examples"
pattern = "examples/**/*.md"

[[categories.buckets]]
id      = "tools"
pattern = "tools/**/*.md"

[[categories.buckets]]
id      = "libs"
pattern = "libs/**/*.md"

# ── Gears ───────────────────────────────────────────────────────────────────

[[categories]]
id    = "gears"
label = "Gears"

[[categories.buckets]]
id      = "gears-system"
pattern = "gears/system/*/**/*.md"

[[categories.buckets]]
id      = "gears-other"
pattern = "gears/*/**/*.md"

